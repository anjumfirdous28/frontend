<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            gap:10px;
            background-color: gray;
                }
        .container div {
            background-color: bisque;
            text-align: center;
            font-size: 40px;
            margin-top: 20px;
            margin-bottom: 20px;
        }   
        .item1 {
            /*grid-column-start: 1;
            grid-column-end: 4;
*/
            grid-column: 1 /4;     
} 
        .item2 {
            grid-row-start: 2;
            grid-row-end: 4;
            text-align: center;
        }    
    </style>
</head>
<body>
    <h1>grid layouts</h1>
    <div class="container">
         <div class="item1">HEADER</div>
         <div class="item2">side content</div>
         <div class="item3">3</div>
         <div class="item4">4</div>
         <div class="item5">5</div>
    </div>         
</body>
</html>
