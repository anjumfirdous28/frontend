<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box sizing</title>
    <style>
        * {
        margin: 0;
    }
        h1 {
            text-shadow: 10px 10px 5px aqua;
        }
        .nb {
            width: 100px;
            height: 100px;
            background-color: aqua;
            margin: 20px;
            padding:20px;
            border: 10px solid blue;
        }
        .cb {
            width: 100px;
            height: 100px;
            background-color: aqua;
            margin: 20px;
            padding: 20px;
            box-sizing: content-box;
            border: 20px solid blue;
        }
        .bb {
            width: 100px;
            height: 100px;
            background-color: aqua;
            margin: 20px;
            padding: 20px;
            box-sizing: border-box;
            border: 5px solid blue;
        }
    </style>
</head> 
<body>
    <h1>Box Sizing</h1>
    <div class="nb">Normal Box</div>
    <div class="cb">Content Box</div>
    <div class="bb">Border Box</div>
</body>
</html>
