<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>heading</h1></center>
    <h1 style="text-align: center;">sub heading</h1>
    <!-- block level element: completely occupies width of browser displays in newline example div,p,pre,h1-h6,etc-->
    <div>Hello</div>
    <div>Hi</div>
    <p>hello</p> 
    <!--inline level * all formatting tags are inline that is display on same line-->
    <span>hi</span>
    <span>hello everyone</span>
    <p style="color: red;">good people</p>   
    <p>good<span style="color: blue;"> people</span></p>
</body>
</html>
