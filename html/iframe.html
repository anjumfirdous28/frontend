<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe in html</title>
</head>
<body>
    <h1>My webpage</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ab consequatur animi reprehenderit ut velit. Eum qui, voluptatum quia quasi corrupti ea saepe enim alias eveniet molestiae facere architecto distinctio non!</p>
    <iframe src="https://www.kodnest.com" name="frame1" width="600px" height="600px" title="its a website"></iframe>
    <!-- it is inline level element -->
    <iframe src="https://www.flipkart.com/" name="frame2" height="300px" width="300px" title="its a website" frameborder="0" scrolling="no"></iframe>
     <iframe srcdoc='<h1>my own webpage</h1><a href="">click here to visit kodnest</a>' name="frame1" width="600px" height="600px" title="its a website"></iframe>
    
</body>
</html>
