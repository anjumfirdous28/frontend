<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>DOM methods</h1>
    <p>getElementsbytagname</p>
    <p id="paraid" class="bluetext">getElementsbyId</p>
    <p class="bluetext">getElementsbyclassname</p>
    <p>getElementsbyname</p>
    <h3 class ="wb">hello</h3>
    <h3 class="wb">thank you</h3>
    <input type="text" placeholder="enter fav" name="fav">
    <p id="paravalue">value displayed here</p>
    <button onclick="change()">click me to change</button>
    <script>
        let p =document.querySelectorAll("h3");
        p.forEach((p)=>{p.style.color="white";p.style.backgroundColor="black"});
         document.querySelector("h1").innerHTML = "<h4><i>DOM methods in js</i></h4>";

        //document.querySelector("h1").innerText = "DOM methods in js";
        document.querySelector("button").textContent="click me for colors";
        document.getElementsByTagName("p")[0].style.color="green";
        document.getElementById("paraid").style.fontSize="50px";
        let bt=document.getElementsByClassName("bluetext");
        for (let i=0;i<=bt.length;i++){
            bt[i].style.color="blue";
            bt[i].style.backgroundColor="pink";
        }
        function change(){
            let x=document.getElementsByName("fav")[0].value;
            document.getElementById("paravalue").innerText=x; 
            let paras=document.getElementsByTagName("p")
            for (let i=0;i<=paras.length;i++){
                paras[i].style.color="red";
                paras[i].style.backgroundColor="yellow";
        }
    }
    
    </script>
</body>
</html>
